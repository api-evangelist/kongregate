apis:
- name: Kongregate Client JavaScript API
  description: >-
    Browser-side JavaScript API loaded by script tag from cdn1.kongregate.com. Exposes kongregate.services.*
    for player identity (getUserId, getUsername, getGameAuthToken, isGuest, showRegistrationBox, resizeGame,
    addEventListener), kongregate.stats.submit for statistic submission, and kongregate.mtx.* for the
    Kreds purchase and inventory flow. Unity WebGL games consume it through jsLib bindings and the official
    Kongregate WebGL template.
  humanURL: https://docs.kongregate.com/docs/javascript-api
  baseURL: https://cdn1.kongregate.com/javascripts/kongregate_api.js
