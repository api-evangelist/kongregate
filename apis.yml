aid: kongregate
name: Kongregate
description: >-
  Kongregate is a browser-game platform and publisher that hosts thousands of free online games
  across action, puzzle, RPG, strategy, idle and multiplayer genres. For game developers it
  operates a two-part developer API: a CDN-delivered client JavaScript API (with Unity WebGL
  bindings) handling player identity, in-page registration, statistic submission and the Kreds
  purchase flow; and a server-side REST API at api.kongregate.com that authenticates players,
  reads and consumes the Kreds virtual-goods inventory, submits statistics, reads
  lifetime/weekly/daily/friends leaderboards, and registers game-defined guilds and characters.
  Kongregate monetizes through Kreds, its own virtual currency, and rewards player engagement
  with badges and collectible Kongpanions. Outbound API callbacks are delivered as HMAC-SHA256
  signed requests. Kongregate Inc. is backed by Lightspeed Venture Partners and Uncork Capital.
