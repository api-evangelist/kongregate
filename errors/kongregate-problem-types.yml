coverage_gaps:
- >-
  Only 2 of the 15 published operations declare any non-2xx response at all
  (server-api-use-item and server-api-kongpanions), and both of those declare a bare 400 with an
  empty schema.
- >-
  13 of 15 operations declare a 200 response only. There is no documented behaviour for
  authentication failure, authorization failure, rate limiting, or server error on the guild,
  character, shared-link, statistics, high-score, item-list or user-info operations.
- >-
  No error code registry is published. The only two enumerated codes (400, 403) appear as
  inline examples on a single operation rather than in a catalogue.
- >-
  No 401, 403, 404, 409, 429 or 5xx responses are declared anywhere in the specification.

