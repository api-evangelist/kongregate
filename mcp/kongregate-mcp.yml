safety:
  read_only_tools:
  - authenticate_user
  - get_user_info
  - list_friends_high_scores
  - list_high_scores
  - list_items
  - list_kongpanions
  - list_user_items
  - list_user_kongpanions
  mutating_tools:
  - consume_item_instance
  - create_guild
  - create_shared_link
  - destroy_guild
  - destroy_shared_link
  - submit_statistics
  - upsert_character
  warnings:
  - consume_item_instance and submit_statistics are NOT idempotent — Kongregate documents no idempotency
    key, so an agent retry can double-consume an item or double-count an 'add' statistic.
  - destroy_guild and destroy_shared_link are destructive and unrecoverable; gate behind human confirmation.
  - Errors arrive as HTTP 200 with success:false in the body — a tool wrapper MUST branch on the body's
    success field or it will report failures as successes.
